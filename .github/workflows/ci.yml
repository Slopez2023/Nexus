name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.8, 3.9, '3.10', '3.11']

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest-cov bandit safety

    - name: Lint with flake8
      run: |
        pip install flake8
        flake8 nexus/ tests/ scripts/ --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 nexus/ tests/ scripts/ --count --exit-zero --max-complexity=10 --max-line-length=88 --statistics

    - name: Type check with mypy
      run: |
        pip install mypy
        mypy nexus/ --strict --ignore-missing-imports

    - name: Test with pytest
      run: |
        pytest tests/ -v --cov=nexus --cov-report=xml --cov-report=term-missing --cov-fail-under=90

    - name: Security scan with bandit
      run: |
        bandit -r nexus/ -f json -o bandit-report.json --exit-zero
        bandit -r nexus/ -f txt

    - name: Dependency check with safety
      run: |
        safety check --output text

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

  docs:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install sphinx sphinx-rtd-theme

    - name: Build documentation
      run: |
        cd docs
        make html

    - name: Upload documentation
      uses: actions/upload-artifact@v3
      with:
        name: docs
        path: docs/_build/html/

  performance:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run performance benchmarks
      run: |
        python -c "
        import time
        from nexus.strategies import TradeSignal
        from datetime import datetime

        # Benchmark signal creation
        start = time.time()
        signals = []
        for i in range(10000):
            signals.append(TradeSignal(
                symbol=f'TEST{i}',
                timestamp=datetime.now(),
                direction='long' if i % 2 == 0 else 'short',
                confidence=0.5 + (i % 50) / 100.0,
                reasoning=f'Test signal {i}',
                metadata={'index': i}
            ))
        end = time.time()
        print(f'Signal creation: {len(signals)} signals in {end-start:.3f}s')
        print(f'Rate: {len(signals)/(end-start):.0f} signals/second')
        "
